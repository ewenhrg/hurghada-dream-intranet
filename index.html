<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no" />
    <!-- Prévenir le zoom automatique sur focus input iOS -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#1e0b4a" />
    <meta name="description" content="Système de gestion des devis et activités pour Hurghada Dream" />
    <meta name="keywords" content="hurghada, dream, devis, activités, gestion" />
    <meta name="author" content="Hurghada Dream" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hurghada Dream" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex, nofollow" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icon (pour iOS) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!--
      Polices Google : UNE seule requête (Literata + Plus Jakarta Sans + Outfit),
      chargée en non bloquant. Inter est servie en local par le bundle.
      Le `media="print"` puis `onload` évite de retarder le premier rendu ;
      `display=swap` affiche immédiatement le texte avec la police de repli.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,600;0,7..72,700;0,7..72,800;1,7..72,500&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,600;0,7..72,700;0,7..72,800;1,7..72,500&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,600;0,7..72,700;0,7..72,800;1,7..72,500&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      />
    </noscript>
    <title>Hurghada Dream - Gestion des devis</title>
    <!--
      Pages clients : fond ivoire dès le premier rendu (sinon le fond intranet sombre flashe
      avant React). Classe retirée par PublicAppShell, l’intranet n’est jamais concerné.
    -->
    <style>
      html.hd-public-boot,
      html.hd-public-boot body { background: #FAF6EF !important; }
    </style>
    <script>
      (function () {
        var p = location.pathname;
        var client = "%VITE_CLIENT_APP%" === "true";
        var intranet = p === "/intranet" || p.indexOf("/intranet/") === 0;
        var publicPage = p === "/" || /^\/(accueil|catalogue|hotels|demande-hotel|contacts|politique|confidentialite|qui-sommes-nous|tarifs|sejour|mon-sejour|request|b2b|evenements|modification)(\/|$)/.test(p);
        if (!intranet && (client || publicPage)) {
          document.documentElement.classList.add("hd-public-boot");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
